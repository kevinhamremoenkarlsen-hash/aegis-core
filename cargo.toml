[package]
name = "aegis-core"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[workspace]
members = ["kernel"]
resolver = "3"

[build-dependencies]
bootloader = { version = "=0.11.17", default-features = false, features = ["bios"] }
kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
